name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check i18n
        run: node scripts/check-i18n.mjs

      - name: Build deck
        run: node scripts/build.mjs

      - name: Read version
        id: ver
        run: |
          if [ ! -f VERSION ]; then
            echo "VERSION file missing" >&2
            exit 1
          fi
          V=$(tr -d '[:space:]' < VERSION)
          if [ -z "$V" ]; then
            echo "VERSION empty" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Extract changelog notes
        run: |
          V="${{ steps.ver.outputs.version }}"
          python3 - <<'PY'
          from pathlib import Path
          import os
          v = os.environ["V"]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          start = None
          for i, line in enumerate(lines):
              if line.strip() == f"## {v}":
                  start = i
                  break
          if start is None:
              raise SystemExit(f"CHANGELOG.md missing heading ## {v}")
          notes = []
          for line in lines[start + 1:]:
              if line.startswith("## "):
                  break
              notes.append(line)
          body = "\n".join(notes).strip() or f"Release {v}"
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
        env:
          V: ${{ steps.ver.outputs.version }}

      - name: Commit versioned HTML, Pages docs, and changelogs
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kong-introduction.html docs/ CHANGELOG.md CHANGELOG.en.md CHANGELOG.ja.md CHANGELOG.zh.md VERSION
          if git diff --staged --quiet; then
            echo "No versioned artifact changes"
          else
            git commit -m "chore: release ${V} [skip ci]"
            git push
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then
            echo "Release $V already exists — skip"
            exit 0
          fi
          gh release create "$V" \
            kong-introduction.html \
            --title "$V" \
            --notes-file release-notes.md
